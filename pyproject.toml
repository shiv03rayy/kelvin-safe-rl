[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kelvin-safe-rl"
version = "0.1.0"
description = "Safe reinforcement learning with Kalman state estimation for battery thermal management"
readme = "README.md"
license = "MIT"
authors = [{ name = "Shivam Ray" }]
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "gymnasium==1.4.0",
    "pyyaml==6.0.3",
    "pandas==3.1.1",
    "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
